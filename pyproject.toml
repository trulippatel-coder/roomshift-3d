[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roomshift-3d"
version = "0.1.0"
description = "3D Spatial Change Detection for Indoor Environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "opencv-python>=4.10.0",
    "open3d>=0.18.0",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "pillow>=10.4.0",
    "pytest>=8.3.0",
]

[project.scripts]
roomshift = "app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["roomshift*"]
